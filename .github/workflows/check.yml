name: Vérifier MakeItHybrid
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: node --check src/app.mjs && node --check src/store.mjs && node --check src/utils.mjs && node --check sw.js
      - name: Vérifier les programmes, statistiques et médias
        run: node --test tests/test-utils.mjs tests/test-media.mjs
